[project]
name = "edittude"
version = "0.1.0"
description = "Local video-editing agent"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT for Edittude code; third-party components under their own licenses, see THIRD_PARTY_LICENSES"}
license-files = ["LICENSE"]
dependencies = [
    "deepagents>=0.7.15",
    "langchain-deepseek>=1.1.0",
    "python-dotenv>=1.2.3",
    "python-xli[markdown]>=0.2.0",
]

[project.scripts]
edittude = "edittude_v3.cli:main"
edittude-v3 = "edittude_v3.cli:main"
edittude-media = "edittude_v3.media.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edittude_v3", "tools"]
